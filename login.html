<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinTrack — Login</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400&display=swap');
  :root { --bg:#0a0a0f; --card:#1a1a26; --border:#2a2a3a; --accent:#00e5a0; --text:#f0f0f8; --muted:#6b6b8a; --loss:#ff4d6d; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'DM Mono',monospace; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; }
  body::before { content:''; position:fixed; inset:0; background-image:linear-gradient(rgba(0,229,160,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,160,0.03) 1px,transparent 1px); background-size:40px 40px; pointer-events:none; }
  .box { background:var(--card); border:1px solid var(--border); border-radius:20px; padding:48px 40px; width:100%; max-width:420px; position:relative; z-index:1; }
  .logo { font-family:'Syne',sans-serif; font-size:32px; font-weight:800; margin-bottom:4px; }
  .logo span { color:var(--accent); }
  .sub { font-size:11px; color:var(--muted); letter-spacing:3px; text-transform:uppercase; margin-bottom:36px; }
  label { font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); display:block; margin-bottom:6px; }
  input { width:100%; background:#12121a; border:1px solid var(--border); border-radius:8px; padding:12px 14px; color:var(--text); font-family:'DM Mono',monospace; font-size:14px; outline:none; margin-bottom:16px; transition:border-color 0.2s; }
  input:focus { border-color:var(--accent); }
  .btn { width:100%; padding:14px; border:none; border-radius:8px; background:var(--accent); color:#000; font-family:'Syne',sans-serif; font-size:14px; font-weight:700; cursor:pointer; transition:all 0.2s; }
  .btn:hover { background:#00ffb3; }
  .link { text-align:center; margin-top:20px; font-size:12px; color:var(--muted); }
  .link a { color:var(--accent); text-decoration:none; }
  .error { background:rgba(255,77,109,0.15); color:var(--loss); border:1px solid rgba(255,77,109,0.3); border-radius:8px; padding:10px 14px; font-size:12px; margin-bottom:16px; }
</style>
</head>
<body>
<div class="box">
  <div class="logo">Fin<span>Track</span></div>
  <div class="sub">Company P&L Finder</div>
  {% if error %}<div class="error">⚠️ {{ error }}</div>{% endif %}
  <form method="POST">
    <label>Username</label>
    <input type="text" name="username" placeholder="Enter your username" required autofocus>
    <label>Password</label>
    <input type="password" name="password" placeholder="Enter your password" required>
    <button class="btn" type="submit">Login →</button>
  </form>
  <div class="link">No account? <a href="/register">Register here</a></div>
</div>
</body>
</html>
